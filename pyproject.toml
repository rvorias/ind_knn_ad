[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "indad"
dynamic = ["version"]
description = "Operator-friendly anomaly datasets with SPADE, PaDiM, and PatchCore baselines"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "click>=8.0",
    "numpy>=1.24,<3",
    "Pillow>=9",
    "PyYAML>=6",
    "scikit-learn>=1.3",
    "timm>=0.9",
    "torch>=2.2",
    "torchvision>=0.17",
    "tqdm>=4.64",
]

[project.urls]
Repository = "https://github.com/rvorias/ind_knn_ad"
Issues = "https://github.com/rvorias/ind_knn_ad/issues"

[project.optional-dependencies]
web = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.18",
]
export = [
    "onnx>=1.15",
    "onnxruntime>=1.16",
    "onnxscript>=0.1",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

[project.scripts]
indad = "indad.cli:cli_interface"
indad-data = "indad.dataset_cli:cli"
indad-web = "indad.server:main"

[tool.setuptools.packages.find]
include = ["indad*"]

[tool.setuptools.package-data]
indad = ["web/*.html", "web/*.css", "web/*.js"]

[tool.setuptools.dynamic]
version = { attr = "indad._version.__version__" }

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "export: tests that require optional ONNX dependencies",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
